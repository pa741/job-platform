name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'infra/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Apply pending EF Core migrations to the database'
        type: boolean
        default: false

permissions:
  id-token: write # OIDC federated credential; no client secret is stored.
  contents: read
  packages: write # Publishing the API image to GHCR, using the workflow's own token.

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  JP_NAME_PREFIX: ${{ vars.JP_NAME_PREFIX }}
  JP_LOCATION: ${{ vars.JP_LOCATION }}
  # The SQL free offer is region-restricted; see infra/modules/sql.bicep.
  JP_SQL_LOCATION: ${{ vars.JP_SQL_LOCATION }}
  JP_LANDING_STORAGE_ACCOUNT: ${{ vars.JP_LANDING_STORAGE_ACCOUNT }}
  JP_LANDING_CONTAINER: ${{ vars.JP_LANDING_CONTAINER }}
  JP_ADMIN_OBJECT_ID: ${{ secrets.JP_ADMIN_OBJECT_ID }}
  JP_ADMIN_LOGIN_NAME: ${{ secrets.JP_ADMIN_LOGIN_NAME }}
  JP_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  JP_API_CLIENT_ID: ${{ vars.JP_API_CLIENT_ID }}
  JP_API_ALLOWED_ORIGINS: ${{ vars.JP_API_ALLOWED_ORIGINS }}
  JP_AI_PROVIDER: ${{ vars.JP_AI_PROVIDER }}
  # Load-bearing. Unset, the template parameter falls back to the free serverless offer and
  # the deployment tries to downgrade a paid database, which Azure rejects outright with
  # "Cannot update paid database to free database" - a failed pipeline, every push.
  JP_SQL_SKU: ${{ vars.JP_SQL_SKU }}

jobs:
  # The image is built and pushed first: the container app references it by tag, and
  # deploying infrastructure that points at a tag which does not exist yet leaves the
  # revision unable to start.
  api-image:
    name: Build and push API image
    runs-on: ubuntu-latest
    if: github.repository == 'pa741/job-platform'
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          set -euo pipefail
          # Lowercased: GHCR rejects an uppercase repository path, and owner names can carry
          # capitals that ${{ github.repository }} preserves verbatim.
          REPO=$(echo "ghcr.io/${GITHUB_REPOSITORY}-api" | tr '[:upper:]' '[:lower:]')
          echo "image=${REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

      # Required for cache-to type=gha: the default docker driver cannot export a cache,
      # and buildx fails with "Cache export is not supported for the docker driver".
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Build context is the repository root: central package management lives there.
          context: .
          file: src/JobPlatform.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Provision and deploy
    runs-on: ubuntu-latest
    needs: api-image
    # A fork must not attempt to deploy into this subscription.
    if: github.repository == 'pa741/job-platform'
    env:
      JP_API_IMAGE: ${{ needs.api-image.outputs.image }}
    outputs:
      functionAppName: ${{ steps.infra.outputs.functionAppName }}
      apiUrl: ${{ steps.infra.outputs.apiUrl }}
      webName: ${{ steps.infra.outputs.webName }}
      webUrl: ${{ steps.infra.outputs.webUrl }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infra
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "jobplatform-ingest-${GITHUB_RUN_NUMBER}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --no-prompt \
            --query properties.outputs -o json > outputs.json
          echo "functionAppName=$(jq -r .functionAppName.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "apiUrl=$(jq -r .apiUrl.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "webName=$(jq -r .webName.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "webUrl=$(jq -r .webUrl.value outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Publish function
        run: |
          dotnet publish src/JobPlatform.Ingestion/JobPlatform.Ingestion.csproj \
            --configuration Release --output ./publish

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.functionAppName }}
          package: ./publish

  smoke:
    name: Smoke-test the API
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      # Liveness only. It requires no token and touches no dependency, so it verifies the
      # revision actually started without waking the serverless database.
      - name: Wait for the new revision to answer
        run: |
          set -euo pipefail
          URL="${{ needs.deploy.outputs.apiUrl }}/health"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL" > /dev/null; then
              echo "API healthy at $URL"
              exit 0
            fi
            echo "attempt $attempt: not ready yet"
            sleep 10
          done
          echo "API did not become healthy at $URL"
          exit 1

  web:
    name: Build and deploy the dashboard
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.outputs.webName != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # Vite inlines these at build time. None is a secret: a SPA client id and an authority
      # are public by construction, and the API is what enforces authorisation. The API URL
      # comes from the deployment output rather than a variable, so the two cannot drift.
      - name: Build
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ needs.deploy.outputs.apiUrl }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.JP_WEB_CLIENT_ID }}
          VITE_API_SCOPE: api://${{ vars.JP_API_CLIENT_ID }}/Jobs.Read
        run: npm run build

      # This job needs its own login: `az staticwebapp secrets list` reads the deployment
      # token from the control plane, and a job does not inherit the deploy job's session.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Static Web Apps
        run: |
          set -euo pipefail
          npm install -g @azure/static-web-apps-cli
          TOKEN=$(az staticwebapp secrets list             --name "${{ needs.deploy.outputs.webName }}"             --resource-group "$AZURE_RESOURCE_GROUP"             --query properties.apiKey -o tsv)
          swa deploy web/dist --deployment-token "$TOKEN" --env production

      - name: Report
        run: echo "Dashboard deployed to ${{ needs.deploy.outputs.webUrl }}" >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    needs: deploy
    # Schema changes are deliberate, never a side effect of a code push.
    if: github.event_name == 'workflow_dispatch' && inputs.run_migrations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The deploy principal is a contained user in jobsdb with db_ddladmin, granted by
      # `dbadmin grant-migrator` - not an Entra admin on the server. It can change the
      # schema and nothing else. Re-run that grant if this ever starts failing to log in.
      - name: Migrate
        run: |
          set -euo pipefail
          CONNECTION=$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "jobplatform-ingest-${GITHUB_RUN_NUMBER}" \
            --query properties.outputs.sqlConnectionString.value -o tsv)
          dotnet run --project tools/JobPlatform.DbAdmin -- migrate "$CONNECTION"
          # Same job as the migration, deliberately. The concept tables are a projection of
          # the vocabulary shipped in the build, and a schema that has moved without them is
          # a database that silently stops recording assertions for anything new. Idempotent,
          # so it costs nothing on a run where the vocabulary has not changed.
          dotnet run --project tools/JobPlatform.DbAdmin -- seed-concepts "$CONNECTION"
