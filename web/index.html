<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>job-platform</title>
    <meta name="description" content="Job market metrics from a daily scrape of London software roles." />

    <!--
      Preconnect before the stylesheet, or the font request waits on a connection that could
      have been opening while the CSS downloaded. Every face has a real fallback stack in
      tokens.css: a webfont that fails to load must degrade, not disappear.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Karla:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
