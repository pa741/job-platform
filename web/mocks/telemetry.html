<style>
/* ---------------------------------------------------------------------------
   Direction A - Telemetry Console.
   Dark-first: the bare :root carries the dark palette, and light is the override,
   so the un-stamped "system" viewer on a dark OS gets the intended design.
   --------------------------------------------------------------------------- */
:root {
  color-scheme: dark;
  --ground: #0E1417;
  --panel: #151C20;
  --panel-2: #1B2429;
  --line: #26343A;
  --line-soft: #1D272C;
  --ink: #DEE8EA;
  --ink-2: #93A8AE;
  --ink-3: #63797F;
  --signal: #5EC8D8;
  --signal-dim: #2B6874;
  --ok: #3FB950;
  --warn: #E3A008;
  --bad: #E5534B;
  --shadow: 0 18px 40px rgba(0, 0, 0, .45);

  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --cond: "IBM Plex Sans Condensed", "Helvetica Neue", Arial, sans-serif;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --ground: #E9EEEF;
    --panel: #FFFFFF;
    --panel-2: #F3F7F8;
    --line: #D0DBDE;
    --line-soft: #E2EAEC;
    --ink: #0E1417;
    --ink-2: #4C5F65;
    --ink-3: #7A8D93;
    --signal: #0C6F81;
    --signal-dim: #A6D9E1;
    --ok: #1A7F37;
    --warn: #8A5D00;
    --bad: #BE3A31;
    --shadow: 0 18px 40px rgba(14, 20, 23, .14);
  }
}

:root[data-theme="light"] {
  color-scheme: light;
  --ground: #E9EEEF;
  --panel: #FFFFFF;
  --panel-2: #F3F7F8;
  --line: #D0DBDE;
  --line-soft: #E2EAEC;
  --ink: #0E1417;
  --ink-2: #4C5F65;
  --ink-3: #7A8D93;
  --signal: #0C6F81;
  --signal-dim: #A6D9E1;
  --ok: #1A7F37;
  --warn: #8A5D00;
  --bad: #BE3A31;
  --shadow: 0 18px 40px rgba(14, 20, 23, .14);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* Layout ------------------------------------------------------------------ */
.shell { display: grid; grid-template-columns: 226px minmax(0, 1fr); min-height: 100vh; }

.rail {
  border-right: 1px solid var(--line);
  background: var(--panel);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}

.brand { padding: 16px 16px 14px; border-bottom: 1px solid var(--line); }
.brand b {
  font-family: var(--cond); font-weight: 700; font-size: 17px;
  letter-spacing: .01em; display: block;
}
.brand .build {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  margin-top: 3px; display: flex; gap: 6px; align-items: center;
}

.navgroup { padding: 14px 10px 4px; }
.navgroup > span {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); padding-left: 8px;
}
.navgroup ul { list-style: none; margin: 6px 0 0; padding: 0; }

.navgroup button {
  width: 100%; text-align: left; border: 0; background: transparent;
  color: var(--ink-2); font: inherit; font-size: 13px;
  padding: 6px 10px; border-radius: 3px; cursor: pointer;
  display: flex; align-items: center; gap: 9px;
  position: relative;
}
.navgroup button:hover { background: var(--panel-2); color: var(--ink); }
.navgroup button[aria-current="page"] { background: var(--panel-2); color: var(--ink); font-weight: 500; }
.navgroup button[aria-current="page"]::before {
  content: ""; position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 2px; background: var(--signal);
}
.navgroup .count {
  margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
}

.rail footer {
  margin-top: auto; border-top: 1px solid var(--line); padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.who { font-size: 11.5px; color: var(--ink-3); font-family: var(--mono); }
.dotlive { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); display: inline-block; }

/* Top strip: the pipeline, left to right, as it actually runs ------------- */
.strip {
  border-bottom: 1px solid var(--line); background: var(--panel);
  padding: 0 18px; display: flex; align-items: center; gap: 18px;
  height: 56px; position: sticky; top: 0; z-index: 20;
}
.stages { display: flex; align-items: center; gap: 0; position: relative; flex: 1; min-width: 0; overflow: hidden; }
.stage { display: flex; align-items: center; gap: 8px; padding-right: 14px; }
.stage .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent);
}
.stage.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }
.stage .txt { line-height: 1.15; }
.stage .nm {
  font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-2);
}
.stage .vl { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }
.link { width: 26px; height: 1px; background: var(--line); margin-right: 14px; flex: none; }
.pulse {
  position: absolute; top: 50%; width: 5px; height: 5px; margin-top: 12px;
  border-radius: 50%; background: var(--signal); pointer-events: none;
  box-shadow: 0 0 8px var(--signal);
}

.strip .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

select.ctl, button.ctl {
  font: inherit; font-size: 12px; font-family: var(--mono);
  color: var(--ink); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 3px; padding: 5px 9px; cursor: pointer;
}
select.ctl:hover, button.ctl:hover { border-color: var(--signal-dim); }
kbd {
  font-family: var(--mono); font-size: 10px; border: 1px solid var(--line);
  border-radius: 3px; padding: 1px 4px; color: var(--ink-3); background: var(--ground);
}

/* Panels ------------------------------------------------------------------ */
main { padding: 14px 18px 40px; }
.pgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; }
.c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
.c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }

@media (max-width: 1100px) {
  .c3, .c4, .c5 { grid-column: span 6; }
  .c6, .c7, .c8 { grid-column: span 12; }
}
@media (max-width: 720px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .rail .navgroup { padding: 8px; }
  .rail .navgroup ul { display: flex; gap: 4px; }
  .rail footer { margin: 0; border: 0; flex-direction: row; }
  .c3, .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; }
}

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
  padding: 12px 14px 14px; min-width: 0;
}
.panel > header {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
}
.panel h2 {
  margin: 0; font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2);
}
.panel .meta { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.note { color: var(--ink-3); font-size: 11.5px; margin: 8px 0 0; max-width: 62ch; }

/* Stat cell: the number is the visualisation. */
.stat .lbl {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-2);
}
.stat .val {
  font-family: var(--mono); font-size: 30px; font-weight: 500; letter-spacing: -.02em;
  margin-top: 6px; font-variant-numeric: tabular-nums; line-height: 1.05;
}
.stat .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.stat .sub.up { color: var(--ok); } .stat .sub.down { color: var(--bad); }
.spark { display: block; margin-top: 8px; width: 100%; height: 26px; overflow: visible; }

/* Meter: one ratio against its limit. The percentage is always written out. */
.meter + .meter { margin-top: 14px; }
.meter .top { display: flex; align-items: baseline; gap: 8px; }
.meter .top b { font-family: var(--mono); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.meter .top span { font-size: 11.5px; color: var(--ink-2); }
.meter .track { height: 6px; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.meter .fill { height: 100%; background: var(--signal); transform-origin: left center; }
.meter small { display: block; color: var(--ink-3); font-size: 11px; margin-top: 4px; }

/* Ranked bars */
.bars { display: flex; flex-direction: column; gap: 7px; }
.bar { display: grid; grid-template-columns: 116px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.bar .nm { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .tr { height: 14px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.bar .fl { display: block; height: 100%; background: var(--signal-dim); transform-origin: left center; }
.bar.hot .fl { background: var(--signal); }
.bar .vl { font-family: var(--mono); font-size: 11.5px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }

/* Stacked part-to-whole */
.stack { display: flex; gap: 2px; height: 16px; margin: 4px 0 10px; }
.stack i { display: block; transform-origin: left center; border-radius: 1px; }
.keys { display: flex; flex-wrap: wrap; gap: 12px; }
.keys span { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); }
.keys i { width: 9px; height: 9px; border-radius: 1px; }
.keys b { font-family: var(--mono); font-weight: 500; color: var(--ink); }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th {
  text-align: left; font-family: var(--mono); font-weight: 500; font-size: 9.5px;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
  padding: 0 10px 7px; border-bottom: 1px solid var(--line);
}
td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--panel-2); }
.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }

.tag {
  display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono);
  font-size: 10px; letter-spacing: .04em; padding: 2px 6px; border-radius: 2px;
  border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap;
}
.tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.tag.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }

.score {
  font-family: var(--mono); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
  border-left: 2px solid var(--signal); padding-left: 7px;
}
.score.mid { border-color: var(--signal-dim); }
.score.low { border-color: var(--line); color: var(--ink-2); }

/* Live log */
.log { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 11.5px; }
.log li {
  display: grid; grid-template-columns: 62px 1fr auto; gap: 10px;
  padding: 5px 0; border-bottom: 1px solid var(--line-soft); align-items: baseline;
  overflow: hidden;
}
.log .ts { color: var(--ink-3); }
.log .ev { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log .n { color: var(--ink); }

/* Match detail, opened in place */
.detail { grid-column: span 12; }
.axes { display: flex; flex-direction: column; gap: 6px; }
.axis { display: grid; grid-template-columns: 132px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 12px; }
.axis .nm { color: var(--ink-2); }
.axis .tr { height: 5px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.axis .fl { height: 100%; background: var(--signal); transform-origin: left center; }
.axis .vl { font-family: var(--mono); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
h3.sub {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); margin: 0 0 8px; font-weight: 500;
}
ul.tight { margin: 0 0 12px; padding-left: 16px; }
ul.tight li { margin: 3px 0; font-size: 12.5px; color: var(--ink-2); }
p.lead { margin: 0 0 12px; font-size: 13px; color: var(--ink); max-width: 62ch; }

.filters { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.filters label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
input[type="range"] { accent-color: var(--signal); width: 150px; }
input[type="checkbox"] { accent-color: var(--signal); }

.act {
  font: inherit; font-size: 12px; font-family: var(--mono);
  background: var(--signal); color: var(--ground); border: 0; border-radius: 3px;
  padding: 6px 12px; cursor: pointer; font-weight: 500;
}
.act:hover { filter: brightness(1.08); }
.ghost {
  font: inherit; font-size: 12px; font-family: var(--mono);
  background: transparent; color: var(--ink-2); border: 1px solid var(--line);
  border-radius: 3px; padding: 6px 12px; cursor: pointer;
}
.ghost:hover { color: var(--ink); border-color: var(--signal-dim); }

/* Command palette */
.scrim {
  position: fixed; inset: 0; background: color-mix(in srgb, var(--ground) 76%, transparent);
  backdrop-filter: blur(3px); z-index: 60; display: grid; place-items: start center; padding-top: 12vh;
}
.scrim[hidden] { display: none; }
.palette {
  width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--line);
  border-radius: 4px; box-shadow: var(--shadow); overflow: hidden;
}
.palette input {
  width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent;
  color: var(--ink); font: inherit; font-family: var(--mono); font-size: 14px; padding: 13px 14px;
}
.palette input:focus { outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 300px; overflow-y: auto; }
.palette li button {
  width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink-2);
  font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 3px; cursor: pointer;
  display: flex; gap: 10px; align-items: center;
}
.palette li button:hover, .palette li button.on { background: var(--panel-2); color: var(--ink); }
.palette li .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-left: auto; }

.view[hidden] { display: none; }
</style>

/* --- small chart builders ------------------------------------------------ */
function bars(items, hotIndex) {
  const max = Math.max(...items.map((i) => i.n));
  return '<div class="bars">' + items.map((it, i) =>
    '<div class="bar' + (i === hotIndex ? ' hot' : '') + '">' +
    '<span class="nm">' + it.name + '</span>' +
    '<span class="tr"><span class="fl" style="width:' + (it.n / max * 100) + '%"></span></span>' +
    '<span class="vl">' + fmt(it.n) + '</span></div>').join('') + '</div>';
}

function stacked(items) {
  const total = items.reduce((s, i) => s + i.n, 0);
  const tones = ['var(--signal)', 'var(--signal-dim)', 'var(--ink-3)', 'var(--line)'];
  return '<div class="stack">' + items.map((it, i) =>
    '<i style="flex:' + it.n + ';background:' + tones[i % tones.length] + '"></i>').join('') + '</div>' +
    '<div class="keys">' + items.map((it, i) =>
      '<span><i style="background:' + tones[i % tones.length] + '"></i>' + it.name +
      ' <b>' + Math.round(it.n / total * 100) + '%</b></span>').join('') + '</div>';
}

function areaChart(data) {
  const W = 660, H = 176, L = 38, R = 10, T = 14, B = 24;
  const max = Math.ceil(Math.max(...data.map((d) => d.n)) / 100) * 100;
  const x = (i) => L + i * (W - L - R) / (data.length - 1);
  const y = (n) => T + (1 - n / max) * (H - T - B);
  const line = data.map((d, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d.n).toFixed(1)).join(' ');
  const area = line + ' L' + x(data.length - 1).toFixed(1) + ' ' + (H - B) + ' L' + L + ' ' + (H - B) + ' Z';
  const grid = [0, max / 2, max].map((v) =>
    '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line-soft)"/>' +
    '<text x="' + (L - 8) + '" y="' + (y(v) + 3.5) + '" text-anchor="end" class="ax">' + v + '</text>').join('');
  const ticks = data.map((d, i) => (i % 3 === 0 || i === data.length - 1)
    ? '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" class="ax">' + d.d + '</text>' : '').join('');

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="area" style="width:100%;height:auto;display:block">' +
    '<style>.ax{font-family:var(--mono);font-size:9px;fill:var(--ink-3)}</style>' +
    '<defs><clipPath id="wipe"><rect id="wiperect" x="0" y="0" width="' + W + '" height="' + H + '"/></clipPath>' +
    '<linearGradient id="g" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="var(--signal)" stop-opacity=".28"/>' +
    '<stop offset="100%" stop-color="var(--signal)" stop-opacity="0"/></linearGradient></defs>' +
    grid + ticks +
    '<g clip-path="url(#wipe)"><path d="' + area + '" fill="url(#g)"/>' +
    '<path id="trendline" d="' + line + '" fill="none" stroke="var(--signal)" stroke-width="1.75" stroke-linejoin="round"/></g>' +
    '<circle id="tip" cx="' + x(data.length - 1) + '" cy="' + y(data[data.length - 1].n) + '" r="3.5" fill="var(--signal)"/>' +
    '</svg>';
}

function sparkline(values, id) {
  const W = 120, H = 26, max = Math.max(...values), min = Math.min(...values);
  const pts = values.map((v, i) =>
    (i ? 'L' : 'M') + (i * W / (values.length - 1)).toFixed(1) + ' ' +
    (H - 2 - ((v - min) / (max - min || 1)) * (H - 5)).toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path class="sparkpath" d="' + pts + '" fill="none" stroke="var(--signal-dim)" stroke-width="1.5"/></svg>';
}

function countUp(scope) {
  $$('[data-count]', scope).forEach((node) => {
    const target = parseFloat(node.dataset.count);
    const suffix = node.dataset.suffix || '';
    const decimals = (node.dataset.count.split('.')[1] || '').length;
    if (REDUCED) {
      node.textContent = (decimals ? target.toFixed(decimals) : fmt(target)) + suffix;
      return;
    }
    const obj = { v: 0 };
    gsap.to(obj, {
      v: target, duration: 1.1, ease: 'power2.out',
      onUpdate: () => {
        node.textContent = (decimals ? obj.v.toFixed(decimals) : fmt(Math.round(obj.v))) + suffix;
      }
    });
  });
}

function enter(scope) {
  countUp(scope);
  if (REDUCED) return;
  const tl = gsap.timeline();
  tl.from(scope.querySelectorAll('.panel'), { opacity: 0, y: 10, duration: .45, stagger: .04, ease: 'power2.out' })
    .from(scope.querySelectorAll('.bar .fl, .meter .fill, .stack i, .axis .fl'),
      { scaleX: 0, duration: .55, stagger: .015, ease: 'power2.out' }, '-=.3');

  const wipe = scope.querySelector('#wiperect');
  if (wipe) tl.from(wipe, { attr: { width: 0 }, duration: 1, ease: 'power2.inOut' }, '-=.7');

  const tip = scope.querySelector('#tip');
  if (tip) tl.from(tip, { scale: 0, transformOrigin: '50% 50%', duration: .3, ease: 'back.out(2)' }, '-=.15');

  scope.querySelectorAll('.sparkpath').forEach((p) => {
    const len = p.getTotalLength();
    gsap.fromTo(p, { strokeDasharray: len, strokeDashoffset: len },
      { strokeDashoffset: 0, duration: .9, ease: 'power2.out' });
  });
}

function tick() {
  const [src, ev] = LOG_LINES[logSeed % LOG_LINES.length];
  const n = 40 + Math.floor(Math.random() * 260);
  const now = new Date(Date.now() - logSeed * 41000);

    '<span class="ev">' + src + ' &middot; ' + ev + '</span><span class="n">+' + n + '</span>';
  logEl.prepend(li);
  while (logEl.children.length > 9) logEl.lastElementChild.remove();
  logSeed++;
  if (!REDUCED) gsap.from(li, { height: 0, opacity: 0, duration: .35, ease: 'power2.out' });
}
for (let i = 0; i < 7; i++) tick();
if (!REDUCED) setInterval(tick, 4200);

/* --- interaction --------------------------------------------------------- */
const VIEWS = { overview: 'view-overview', matches: 'view-matches', calls: 'view-calls' };

function show(name) {
  const id = VIEWS[name] || 'view-blank';
  $$('.view').forEach((v) => { v.hidden = v.id !== id; });
  $$('.rail button[data-view]').forEach((b) =>
    b.setAttribute('aria-current', b.dataset.view === name ? 'page' : 'false'));
  enter($('#' + id));
  window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
}

$$('.rail button[data-view]').forEach((b) => { b.onclick = () => show(b.dataset.view); });

document.addEventListener('click', (e) => {
  const row = e.target.closest('tr[data-match]');
  if (row) openMatch(Number(row.dataset.match));
});
document.addEventListener('keydown', (e) => {
  const row = e.target.closest && e.target.closest('tr[data-match]');
  if (row && e.key === 'Enter') openMatch(Number(row.dataset.match));
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'minScore') $('#minScoreOut').textContent = e.target.value;
});

$('#theme').onchange = (e) => {
  const v = e.target.value;
  if (v === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', v);
};

/* Command palette */
const COMMANDS = [
  ['Overview', 'page', () => show('overview')],
  ['Matches', 'page', () => show('matches')],
  ['Model calls', 'page', () => show('calls')],
  ['Postings', 'page', () => show('postings')],
  ['Vocabulary', 'page', () => show('vocabulary')],
  ['Filter to LinkedIn', 'board', () => show('postings')],
  ['Filter to freehire.me', 'board', () => show('postings')],
  ['Skill: Kubernetes', 'concept', () => show('postings')],
  ['Area: Cloud and platform', 'concept', () => show('postings')],
  ['Re-run the nightly sweep', 'action', () => show('matches')]
];

const scrim = $('#scrim'), qEl = $('#q'), resultsEl = $('#results');

function renderResults() {
  const q = qEl.value.toLowerCase();
  const hits = COMMANDS.filter(([label]) => label.toLowerCase().includes(q)).slice(0, 7);
  resultsEl.innerHTML = hits.map(([label, kind], i) =>
    '<li><button data-i="' + COMMANDS.indexOf(hits[i]) + '" class="' + (i === 0 ? 'on' : '') + '">' +
    label + '<span class="k">' + kind + '</span></button></li>').join('') ||
    '<li><button disabled>Nothing matches that</button></li>';
  if (!REDUCED) gsap.from(resultsEl.children, { opacity: 0, y: 4, duration: .2, stagger: .02 });
}

function openPalette() {
  scrim.hidden = false;
  qEl.value = '';
  renderResults();
  qEl.focus();
  if (!REDUCED) {
    gsap.from('.palette', { y: -14, opacity: 0, duration: .28, ease: 'power3.out' });
    gsap.from(scrim, { opacity: 0, duration: .2 });
  }
}
function closePalette() { scrim.hidden = true; }

$('#openPalette').onclick = openPalette;
qEl.oninput = renderResults;
resultsEl.onclick = (e) => {
  const b = e.target.closest('button[data-i]');
  if (!b) return;
  closePalette();
  COMMANDS[Number(b.dataset.i)][2]();
};
scrim.onclick = (e) => { if (e.target === scrim) closePalette(); };
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  if (e.key === 'Escape') closePalette();
  if (e.key === 'Enter' && !scrim.hidden) {
    const first = resultsEl.querySelector('button[data-i]');
    if (first) { closePalette(); COMMANDS[Number(first.dataset.i)][2](); }
  }
});
</script>
