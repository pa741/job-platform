<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Karla:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">

<style>
/* ---------------------------------------------------------------------------
   Market Briefing - the full dashboard.

   The direction: the platform opens as something written. A sentence that says
   what happened, then the evidence. Every page keeps that shape.

   Three rules this revision exists to enforce.

   1. CHART COLOUR IS INHERITED, NOT INVENTED. The categorical slots below are
      copied verbatim from src/theme/tokens.css, which is a validated palette -
      it clears CVD separation and contrast in both modes. An earlier revision
      of this mock invented five tints of two hues and cycled them modulo the
      slot count; two of those slots measured 1.02:1 against each other, which
      is the same colour twice. Never substitute a hex by eye here, and never
      generate a fifth category: a fifth folds into Other.

   2. NOTHING ON SCREEN MAY CLAIM WHAT THE SYSTEM DOES NOT DO. The enums are
      the API's enums (CandidacyVerdict, AssertionSource, DemandPolarity,
      AiCallOutcome). Where a number cannot be computed from what the pipeline
      records - money, for one - it is not shown.

   3. MOTION IS BUDGETED. Four things animate: the nav marker, the drawer, an
      expanding entry, and chart marks on first mount. Figures never count up:
      a page mid-animation and a page legitimately reading zero looked
      identical, and the lede spent a second saying the scrapers found nothing.
   --------------------------------------------------------------------------- */
:root {
  color-scheme: light;

  /* Surfaces and ink */
  --paper: #EFF1EE;
  --card: #FFFFFF;
  --ink: #16181A;
  --ink-2: #565B5C;       /* 6.89:1 on card */
  --ink-3: #686E6C;       /* 5.20:1 on card, 4.58:1 on paper - AA at 13px */
  --rule: #D6DAD5;        /* borders only */
  --rule-soft: #E5E8E3;   /* hairlines inside a card */
  --track: #E2E5E1;       /* the ground a datum sits in - never a border */
  --on-ink: #F3F5F2;

  /* Interaction. Not a data colour: nothing in a chart may use it. */
  --accent: #22407A;
  --accent-soft: #C3CFE4;

  /* Status. Fixed, never themed into a series slot. */
  --oxide: #A8542B;       /* attention, and only attention */
  --oxide-soft: #E8D3C6;
  --good: #1F6B3E;

  /* Categorical slots, copied from src/theme/tokens.css. In fixed order.
     Never cycle; a fifth category folds into --series-other. */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-other: #767b79;

  /* One bar, one ramp step. Clears 3:1 against --track in both themes. */
  --bar: #2a78d6;
  --mark-quiet: #8C938B;  /* recessive marks - weekends, dropped axes */

  --lift: 0 20px 50px rgba(22, 24, 26, .13), 0 2px 6px rgba(22, 24, 26, .05);
  --scrim: rgba(22, 24, 26, .34);

  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Karla", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;

  /* Type scale. Seven steps. Nothing between them. */
  --t-micro: 11px;
  --t-small: 13px;
  --t-body-2: 14px;
  --t-body: 15px;
  --t-title: 16px;
  --t-lede: 20px;
  --t-display: 24px;
  --t-figure: 34px;

  /* Spacing scale. Eight steps. Nothing between them. */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
}

/* Dark is designed, not inverted. Every value below was measured against the
   surface it actually lands on; --ink-3's dark value is deliberately lighter
   than its light value, which is what the flipped version got wrong. */
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --paper: #15171A;
    --card: #1C1F22;
    --ink: #E9EAE6;
    --ink-2: #A5AAA8;
    --ink-3: #868C8A;     /* 4.83:1 on card, 5.24:1 on paper */
    --rule: #3A3F42;
    --rule-soft: #292D30;
    --track: #2B2F32;
    --on-ink: #15171A;

    --accent: #93AEE0;
    --accent-soft: #33455F;

    --oxide: #D99163;
    --oxide-soft: #6B4531;
    --good: #67B98A;

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-other: #9a9f9d;

    --bar: #3987e5;
    --mark-quiet: #5E6366;

    --lift: 0 20px 50px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    --scrim: rgba(0, 0, 0, .58);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #15171A;
  --card: #1C1F22;
  --ink: #E9EAE6;
  --ink-2: #A5AAA8;
  --ink-3: #868C8A;
  --rule: #3A3F42;
  --rule-soft: #292D30;
  --track: #2B2F32;
  --on-ink: #15171A;
  --accent: #93AEE0;
  --accent-soft: #33455F;
  --oxide: #D99163;
  --oxide-soft: #6B4531;
  --good: #67B98A;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-other: #9a9f9d;
  --bar: #3987e5;
  --mark-quiet: #5E6366;
  --lift: 0 20px 50px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --scrim: rgba(0, 0, 0, .58);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--t-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
code { font-family: var(--mono); font-size: .92em; }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--s5); }
@media (max-width: 620px) { .wrap { padding: 0 var(--s4); } }

/* One micro-label, used everywhere. There were twelve near-identical
   definitions across four sizes; below 11px an uppercase mono cap height drops
   under 8px, which is where the contrast failures were. */
.kicker, .band .k, .filters .lbl, .field .lbl, th, .src, .keyline,
.appgroup > h3, .sheet h3, h4.mini, .tagline, .dateline, .result-count {
  font-family: var(--mono);
  font-size: var(--t-micro);
  letter-spacing: .04em;
  color: var(--ink-3);
  font-weight: 400;
}
.kicker, .band .k, .filters .lbl, .field .lbl, th,
.appgroup > h3, .sheet h3, h4.mini, .tagline { text-transform: uppercase; }
.tagline { color: var(--oxide); }

/* Chrome ------------------------------------------------------------------ */
.chrome { position: sticky; top: 0; z-index: 40; background: var(--paper); border-bottom: 1px solid var(--rule); }
.bar { display: flex; align-items: center; gap: var(--s5); padding: var(--s4) 0 0; }

h1.mark {
  font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0;
  letter-spacing: -.01em; white-space: nowrap;
}
h1.mark span { color: var(--ink-3); }

.sections {
  position: relative; display: flex; gap: 2px; padding: 3px;
  background: var(--card); border: 1px solid var(--rule); border-radius: 999px;
}
.sections button {
  position: relative; z-index: 1; border: 0; background: transparent; font: inherit;
  font-size: var(--t-small); font-weight: 500; color: var(--ink-2); cursor: pointer;
  padding: 7px 16px; border-radius: 999px; min-height: 32px;
}
.sections button:hover { color: var(--ink); }
.sections button[aria-current="true"] { color: var(--on-ink); }
.sections .thumb {
  position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px;
  background: var(--ink); border-radius: 999px;
  transform-origin: left center; width: 1px;
}

.bar .right { margin-left: auto; display: flex; align-items: center; gap: var(--s3); }
.dateline { text-align: right; line-height: 1.35; }
.dateline b { color: var(--ink-2); font-weight: 400; }
.dateline b.stale { color: var(--oxide); }

select.ctl {
  font-family: var(--mono); font-size: 12px; color: var(--ink-2);
  background: var(--card); border: 1px solid var(--rule); border-radius: 999px;
  padding: 7px 12px; cursor: pointer; min-height: 34px;
}
select.ctl:hover { color: var(--ink); border-color: var(--ink-3); }

nav.pages { display: flex; gap: var(--s5); position: relative; margin-top: var(--s1); }
nav.pages button {
  border: 0; background: transparent; font: inherit; font-size: var(--t-body-2); cursor: pointer;
  color: var(--ink-3); padding: 10px 0 12px; white-space: nowrap;
}
nav.pages button:hover { color: var(--ink); }
nav.pages button[aria-current="page"] { color: var(--ink); }
nav.pages .marker {
  position: absolute; bottom: -1px; height: 2px; background: var(--accent);
  left: 0; width: 1px; transform-origin: left center;
}

.burger {
  display: none; margin-left: auto; border: 1px solid var(--rule); background: var(--card);
  border-radius: 999px; width: 44px; height: 44px; cursor: pointer; position: relative;
}
.burger i { position: absolute; left: 13px; width: 18px; height: 1.5px; background: var(--ink); border-radius: 2px; display: block; }
.burger i:nth-child(1) { top: 16px; }
.burger i:nth-child(2) { top: 21px; }
.burger i:nth-child(3) { top: 26px; }

.chrome .now { display: none; }
@media (max-width: 860px) {
  .sections, nav.pages, .bar .right { display: none; }
  .burger { display: block; }
  .bar { padding: var(--s3) 0; }
  h1.mark { font-size: var(--t-lede); }
  .chrome .now { display: block; margin-left: var(--s3); }
}
@media (max-width: 460px) { .chrome .now { display: none; } }

/* Mobile sheet ------------------------------------------------------------ */
.sheet {
  position: fixed; inset: 0; z-index: 60; background: var(--paper);
  overflow-y: auto; overscroll-behavior: contain; padding: var(--s5) var(--s4) var(--s7);
}
.sheet[hidden] { display: none; }
.sheet .head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s5); }
.sheet .close {
  margin-left: auto; border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  border-radius: 999px; width: 44px; height: 44px; font-size: 20px; cursor: pointer; line-height: 1;
}
.sheet section { margin-bottom: var(--s5); }
.sheet h3 { margin: 0 0 var(--s1); padding-bottom: var(--s2); border-bottom: 1px solid var(--rule); }
.sheet button.page {
  display: block; width: 100%; text-align: left; border: 0; background: transparent;
  font-family: var(--display); font-size: var(--t-display); font-weight: 400; color: var(--ink);
  padding: 10px 0; cursor: pointer; letter-spacing: -.01em; min-height: 44px;
}
.sheet button.page[aria-current="page"] { color: var(--accent); }
.sheet button.page span { font-family: var(--mono); font-size: var(--t-micro); color: var(--ink-3); margin-left: var(--s2); }
.sheet .controls { display: flex; gap: var(--s3); flex-wrap: wrap; padding-top: var(--s2); }

/* The lede ---------------------------------------------------------------- */
.lede {
  font-family: var(--display); font-weight: 400; font-size: var(--t-lede);
  line-height: 1.5; letter-spacing: -.005em; max-width: 46ch;
  margin: var(--s6) 0 var(--s2); text-wrap: pretty;
}
@media (min-width: 700px) { .lede { font-size: 23px; } }

/* A figure inside the sentence. A tint rather than an underline: the underline
   measured 1.38:1 on paper, so the device marking a number as live was
   invisible. Never applied to a word. */
.fig {
  font-family: var(--mono); font-weight: 500; font-size: .78em;
  color: var(--ink); font-variant-numeric: tabular-nums;
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  padding: 1px 5px; border-radius: 3px;
}
.fig.warn { background: color-mix(in srgb, var(--oxide) 16%, transparent); color: var(--oxide); }

.lede-note {
  font-size: var(--t-small); color: var(--ink-3); max-width: 64ch;
  margin: 0 0 var(--s6); border-left: 2px solid var(--rule); padding-left: var(--s3);
}

/* Figures band. No vertical rules: the grid wraps, and a right border on a
   wrapped cell points into empty space. */
.band {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  border-top: 1px solid var(--rule); margin-bottom: var(--s6);
}
@media (max-width: 1000px) { .band { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 700px) { .band { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.band > div { padding: var(--s4) var(--s5) var(--s4) 0; border-bottom: 1px solid var(--rule); }
.band .v {
  font-family: var(--display); font-weight: 400; font-size: var(--t-figure); line-height: 1.05;
  letter-spacing: -.02em; margin-top: var(--s1); font-variant-numeric: tabular-nums;
}
.band .n { font-size: 12px; color: var(--ink-2); margin-top: var(--s1); }

/* Cards ------------------------------------------------------------------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--s5); }
.s4 { grid-column: span 4; } .s5 { grid-column: span 5; }
.s6 { grid-column: span 6; } .s7 { grid-column: span 7; }
.s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
@media (max-width: 1080px) and (min-width: 721px) {
  .s4, .s5 { grid-column: span 6; }
  .s6, .s7, .s8 { grid-column: span 12; }
}
@media (max-width: 720px) { .s4, .s5, .s6, .s7, .s8 { grid-column: span 12; } }

.card {
  background: var(--card); border: 1px solid var(--rule); border-radius: 2px;
  padding: var(--s5); min-width: 0;
}
.card h2 { font-size: var(--t-title); font-weight: 600; margin: 0; letter-spacing: -.005em; text-wrap: balance; }
.card h2.big, .drawer h2.big {
  font-family: var(--display); font-weight: 400; font-size: var(--t-display);
  letter-spacing: -.015em; text-wrap: balance;
}
.kicker { margin-bottom: var(--s1); display: block; }
.card .sub { font-size: var(--t-small); color: var(--ink-2); margin: var(--s1) 0 var(--s4); max-width: 58ch; }
.card .sub:last-child { margin-bottom: 0; }
.alert { border-left: 3px solid var(--oxide); padding-left: 21px; }

/* Ranked list. 6px bar on a real track: the 2px rule measured 1.57:1 against
   the card and was the primary chart form on the page. */
.rank { display: flex; flex-direction: column; gap: var(--s3); }
.rank .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: var(--s3); }
.rank .nm { font-size: var(--t-body-2); }
.rank .vl { font-family: var(--mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rank .measure { height: 6px; background: var(--track); margin-top: var(--s1); grid-column: 1 / -1; border-radius: 2px; overflow: hidden; }
.rank .measure i { display: block; height: 100%; background: var(--bar); transform-origin: left center; }

.chart { width: 100%; height: auto; display: block; }
.chart .lbl { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-3); }
.chart .col { transform-box: fill-box; transform-origin: 50% 100%; }
.axis-note { font-family: var(--mono); font-size: var(--t-micro); color: var(--ink-3); margin-top: var(--s2); }

/* Part-to-whole. Taller segments, a hairline gap, and every share written out
   beside its name - the bar is reinforcement, never the only encoding. */
.split { display: flex; height: 14px; gap: 1px; margin: var(--s1) 0 var(--s3); border-radius: 2px; overflow: hidden; }
.split i { display: block; transform-origin: left center; }
.keys { display: grid; grid-template-columns: 10px 1fr max-content; gap: var(--s2) var(--s2); align-items: center; max-width: 380px; }
.keys i { width: 10px; height: 10px; border-radius: 2px; }
.keys span { font-size: var(--t-small); }
.keys b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.cols { columns: 2; column-gap: var(--s5); }
@media (max-width: 900px) { .cols { columns: 1; } }
.thing {
  font-family: var(--mono); font-size: 12px; break-inside: avoid;
  padding: var(--s1) 0; border-bottom: 1px solid var(--rule-soft);
  display: flex; gap: var(--s2); align-items: baseline;
}
.thing .why { color: var(--ink-3); font-family: var(--sans); font-size: 12px; }
.thing .ct { margin-left: auto; color: var(--ink-2); }

/* Stamps ------------------------------------------------------------------ */
.stamp {
  font-family: var(--mono); font-size: var(--t-micro); letter-spacing: .04em;
  padding: 2px 7px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink-2);
  white-space: nowrap; display: inline-block;
}
.stamp.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 55%, var(--rule)); }
.stamp.warn { color: var(--oxide); border-color: color-mix(in srgb, var(--oxide) 55%, var(--rule)); }
.stamp.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }

/* Tables ------------------------------------------------------------------ */
.scroll-x { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--t-small); }
th { text-align: left; padding: 0 var(--s3) var(--s2); border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
td { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--rule-soft); vertical-align: baseline; }
tbody tr.rowlink { cursor: pointer; }
tbody tr.rowlink:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td .where { color: var(--ink-3); }
/* A badge in a right-aligned cell destroys the alignment it is there for, so
   the flags live in their own column. */
td.flags { white-space: nowrap; }

/* Filters. Explicit columns: auto-fit fitted seven of eight tracks at the
   default desktop width and orphaned Sort on a row of its own. */
.filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); margin-bottom: var(--s5); }
@media (max-width: 900px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .filters { grid-template-columns: 1fr; } }
.filters label { display: flex; flex-direction: column; gap: var(--s1); }
.filters input, .filters select, .field input, .field select, .field textarea, .explorer input {
  font: inherit; font-size: var(--t-small); color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 2px; padding: 8px 10px; width: 100%; min-height: 36px;
}
.filters input[type="range"] { padding: 0; accent-color: var(--accent); border: 0; background: transparent; min-height: 24px; }
.result-count { margin: calc(-1 * var(--s3)) 0 var(--s4); }

/* Shortlist entries ------------------------------------------------------- */
.entry {
  display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: var(--s5);
  padding: var(--s5) 0; border-bottom: 1px solid var(--rule-soft);
}
.entry .figcol { text-align: left; }
.entry .score {
  font-family: var(--display); font-weight: 400; font-size: 40px; line-height: .95;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums;
}
.entry .of { font-family: var(--mono); font-size: var(--t-micro); color: var(--ink-3); }
.entry .of b { color: var(--ink-2); font-weight: 400; }
.entry .title {
  font-family: var(--sans); font-size: var(--t-title); font-weight: 600; margin: 0;
  background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; text-align: left;
}
.entry .title:hover { color: var(--accent); }
.entry .meta { font-size: var(--t-small); color: var(--ink-2); margin-top: var(--s1); display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center; }
.entry .meta .sep { color: var(--rule); }
.entry .dismiss {
  margin-left: auto; border: 0; background: transparent; font: inherit; font-size: 12px;
  color: var(--ink-3); cursor: pointer; padding: 4px 8px; border-radius: 2px; min-height: 28px;
}
.entry .dismiss:hover { color: var(--oxide); background: color-mix(in srgb, var(--oxide) 10%, transparent); }

.undobar {
  display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--rule); border-left: 3px solid var(--oxide);
  border-radius: 2px; padding: var(--s3) var(--s4); margin-bottom: var(--s4); font-size: var(--t-small);
}
.undobar[hidden] { display: none; }
.undobar b { font-weight: 600; }

/* A figure in the lede that goes somewhere. The lede is the day's decisions,
   so the numbers in it are the way into them. */
button.fig {
  border: 0; cursor: pointer; font-family: var(--mono); font-weight: 500; font-size: .78em;
  color: var(--ink); background: color-mix(in srgb, var(--accent) 12%, transparent);
  padding: 1px 5px; border-radius: 3px; font-variant-numeric: tabular-nums;
}
button.fig:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
button.fig.warn { background: color-mix(in srgb, var(--oxide) 16%, transparent); color: var(--oxide); }
button.fig.warn:hover { background: color-mix(in srgb, var(--oxide) 26%, transparent); }

/* The anti-join: what the market asks for that the profile does not hold. */
.gap { display: grid; grid-template-columns: minmax(140px, 1fr) auto; gap: var(--s2) var(--s4); padding: var(--s3) 0; border-bottom: 1px solid var(--rule-soft); }
.gap:last-child { border-bottom: 0; }
.gap .nm { font-size: var(--t-body-2); font-weight: 600; }

function splitBar(items) {
  const total = items.reduce((s, i) => s + i.n, 0);
  const shown = items.length <= 5 ? items

  return '<div class="split">' + shown.map((it, i) =>
    '<i style="flex:' + it.n + ';background:' + SERIES[i] + '"></i>').join('') + '</div>' +

  const bw = step * 0.56;
  const y = (n) => T + (1 - n / max) * (H - T - B);

  const grid = [0, max / 2, max].map((v) =>
    '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--rule-soft)"/>' +
    '<text x="' + (L - 7) + '" y="' + (y(v) + 3.5) + '" text-anchor="end" class="lbl">' + v + '</text>').join('');

  const bars = data.map((d, i) => {
    const x = L + i * step + (step - bw) / 2;
    return '<rect class="col" x="' + x.toFixed(1) + '" y="' + y(d.n).toFixed(1) + '" width="' + bw.toFixed(1) +
      '" height="' + (H - B - y(d.n)).toFixed(1) + '" fill="' + (d.weekend ? 'var(--mark-quiet)' : 'var(--bar)') + '"></rect>';
  }).join('');

  const ticks = data.map((d, i) => (i % 3 === 0 || i === data.length - 1)
    ? '<text x="' + (L + i * step + step / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" class="lbl">' + d.d + '</text>'
    : '').join('');

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" ' +
    'aria-label="New postings per scrape day over fourteen days, weekends recessive">' + grid + bars + ticks + '</svg>';
}

/* =========================================================================
   The anti-join: what the corpus asks for that the profile does not hold.

   A set difference over two tables of the same shape, which is the whole
   payoff of postings and profiles sharing one vocabulary. Every other figure
   on this page is about the corpus; this one is about the reader, and it is
   the only one that changes what they would do next.

   The near-miss walk matters as much as the difference: "you do not have
   Terraform" is a fact, and "you hold Bicep, which the graph records as
   Related rather than equivalent, so it earns partial credit and never full"
   is the same fact with something to do about it.
   ========================================================================= */
const held = new Set(
  DATA.profile.declared.map((d) => d[0]).concat(DATA.profile.extracted.map((e) => e[0]))
);

function nearMiss(key) {
  const c = conceptOf(key);
  if (!c) return null;
  const down = c.narrower.find((k) => held.has(k));
  if (down) return { key: down, rel: 'Specialisation' };
  const side = c.related.find((k) => held.has(k));
  if (side) return { key: side, rel: 'Related' };
  const back = DATA.concepts.find((x) => held.has(x.key) && x.related.includes(key));
  if (back) return { key: back.key, rel: 'Related' };
  const up = c.broader.find((k) => held.has(k));
  if (up) return { key: up, rel: 'Generalisation' };
  return null;
}

const REL_CONSEQUENCE = {
  Specialisation: 'satisfies it outright and scores as a full hit',
  Generalisation: 'is broader than what they ask for, so it earns partial credit',
  Related: 'is recorded as comparable rather than equivalent, so it earns partial credit and never full'
};

function antiJoinRows() {
  return DATA.demand
    .filter((d) => !held.has(d.key))
    .sort((a, b) => b.inBand - a.inBand)
    .map((d) => {
      const c = conceptOf(d.key);
      const near = nearMiss(d.key);
      let why;
      if (c.kind === 'Qualification') {
        why = 'A qualification, not a skill: it cannot be picked up before an application closes, so this is a ' +
          'filter on what you can apply to rather than something to learn. <em>' + d.inBand + ' of your matches ' +
          'are gated behind it.</em>';
      } else if (near) {
        why = 'You hold <em>' + labelOf(near.key) + '</em>, which the graph records as <em>' + near.rel +
          '</em> &mdash; it ' + REL_CONSEQUENCE[near.rel] + '.';
      } else {
        why = 'Nothing in your profile touches it, by any relation in the graph. This is the gap with no ' +
          'partial credit behind it.';
      }
      return '<div class="gap"><span class="nm">' + c.label + '</span>' +
        '<span class="counts"><b>' + d.inBand + '</b> of your 248 &middot; ' + fmt(d.postings) + ' in the corpus</span>' +
        '<p class="why">' + why + '</p></div>';
    }).join('');
}

const LEVELS = ['Junior', 'Mid', 'Senior', 'Lead', 'Principal'];
const filters = { q: '', board: '', concept: '', level: '', work: '', minSalary: '', interval: '', sort: 'firstSeen' };

function conceptOptions() {
  const areas = DATA.concepts.filter((c) => c.kind === 'Area');
  const rest = DATA.concepts.filter((c) => c.kind !== 'Area');
  return '<optgroup label="Areas">' + areas.map((c) =>
    '<option value="' + c.key + '">' + c.label + ' (' + fmt(c.n) + ')</option>').join('') + '</optgroup>' +

      '<option value="' + c.key + '">' + c.label + ' (' + fmt(c.n) + ')</option>').join('') + '</optgroup>';
}

const annual = (p) => p.low == null ? null : (p.interval === 'day' ? p.high * 220 : p.high);

function matchesFilters(p) {
  const f = filters;
  if (f.q && !(p.title + ' ' + p.company).toLowerCase().includes(f.q.toLowerCase())) return false;
  if (f.board && p.board !== f.board) return false;
  if (f.concept) {
    const direct = p.concepts.includes(f.concept);
    const viaArea = p.concepts.some((k) => (conceptOf(k) || { broader: [] }).broader.includes(f.concept));
    if (!direct && !viaArea) return false;
  }
  if (f.level && LEVELS.indexOf(p.level) < LEVELS.indexOf(f.level)) return false;
  if (f.work && p.work !== f.work) return false;
  if (f.interval && (p.interval || 'year') !== f.interval) return false;
  if (f.minSalary) { const a = annual(p); if (a == null || a < Number(f.minSalary)) return false; }
  return true;
}

function salaryCell(p) {
  if (p.low == null) return '<td class="num">not stated</td>';
  const unit = p.interval === 'day' ? '/day' : '';
  const lo = p.interval === 'day' ? '£' + p.low : money(p.low);
  const hi = p.interval === 'day' ? '£' + p.high : money(p.high);
  return '<td class="num">' + lo + ' – ' + hi + unit + '</td>';
}

function postingRows() {
  let rows = DATA.postings.filter(matchesFilters);
  if (filters.sort === 'salary') rows = rows.slice().sort((a, b) => (annual(b) || 0) - (annual(a) || 0));
  if (filters.sort === 'company') rows = rows.slice().sort((a, b) => a.company.localeCompare(b.company));

  if (!rows.length) {
    return '<tr><td colspan="7"><div class="empty">Nothing matches those facets. Every count beside a facet is ' +
      'what the API counted over the corpus, so a zero here means the corpus really is empty for that combination.</div></td></tr>';
  }

  return rows.map((p) =>
    '<tr class="rowlink" data-posting="' + p.id + '" tabindex="0">' +
    '<td>' + p.title + ' <span class="where">' + p.where + '</span></td>' +
    '<td>' + p.company + '</td>' +
    '<td>' + p.board + '</td>' +
    '<td class="num">' + p.firstSeen + '</td>' +
    salaryCell(p) +
    '<td>' + p.work + ' &middot; ' + p.level + '</td>' +
    '<td class="flags">' +
    (p.repost ? '<span class="stamp warn">board says ' + p.boardSays + '</span> ' : '') +
    (p.salarySource === 'prose' ? '<span class="stamp">from prose</span> ' : '') +
    (p.interval === 'day' ? '<span class="stamp">day rate</span> ' : '') +
    (p.clearance ? '<span class="stamp warn">clearance</span> ' : '') +
    (p.applicants != null ? '<span class="stamp">' + p.applicants + ' applicants</span>' : '') +
    '</td></tr>').join('');
}

    '<h4 class="mini">Related</h4>' + pills(c.related, 'No sideways edges recorded.') +

const byScore = DATA.matches.slice().sort((a, b) => b.score - a.score).map((m) => m.id);

function entryHtml(m, rankIndex) {
  const scorePlace = byScore.indexOf(m.id) + 1;
  const moved = scorePlace !== rankIndex + 1;
  return '<article class="entry" data-match="' + m.id + '">' +
    '<div class="figcol"><div class="score">' + m.score + '</div>' +
    '<div class="of">ranked <b>' + (rankIndex + 1) + '</b>' + (moved ? ', scores <b>' + scorePlace + '</b>' : '') + '</div></div>' +
    '<div><button class="title" aria-expanded="false">' + m.title + '</button>' +
    '<div class="meta"><span>' + m.company + '</span><span class="sep">/</span>' +
    '<span>' + m.work + '</span><span class="sep">/</span><span>' + m.salary + '</span>' +
    verdictStamp(m) +
    (m.unmet ? '<span class="stamp warn">' + m.unmet + ' unmet</span>' : '') +
    '<span class="stamp">' + Math.round(m.coverage * 100) + '% assessed</span>' +
    (m.arrived ? '<span class="stamp on">new ' + m.arrived + '</span>' : '') +
    (m.changed ? '<span class="stamp on">verdict changed</span>' : '') +
    '<button class="dismiss" data-dismiss="' + m.id + '">Not for me</button>' +
    '</div>' +
    (m.changed ? '<p class="sub" style="margin:8px 0 0">' + m.changed + '</p>' : '') +
    '<div class="expand" style="height:0"><div class="expand-inner">' + matchDetail(m) + '</div></div></div></article>';
}

/* CandidacyVerdict is Weak | Possible | Strong | Unknown. Unknown is a
   judgement that came back inconclusive, and null is no judgement at all;
   collapsing them loses the distinction the enum exists to carry. */
function verdictStamp(m) {
  if (m.verdict === null) return '<span class="stamp">not judged yet</span>';
  if (m.verdict === 'Unknown') return '<span class="stamp">judged inconclusive</span>';
  const cls = m.verdict === 'Strong' ? 'good' : m.verdict === 'Weak' ? 'warn' : '';
  return '<span class="stamp ' + cls + '">' + m.verdict + '</span>';
}

const RELATION_NOTE = {
  Exact: 'the same concept', Specialisation: 'you hold something more specific',
  Generalisation: 'you hold something broader', Implied: 'implied by what you hold',
  Related: 'comparable, not equivalent', Superseded: 'you hold the successor'
};

function matchDetail(m) {
  const maxW = Math.max(...m.axes.map((a) => a[2]));
  return '<div class="two"><div><h4 class="mini">How the score was reached</h4>' +
    '<p class="sub" style="margin-top:0">Bar length is how much each axis weighs; the fill is how well it scored.</p>' +
    '<div class="axes">' +
    m.axes.map(([nm, v, w]) => w === 0
      ? '<div class="ax dropped"><span class="nm">' + nm + '</span><span class="tr"></span>' +
        '<span class="vl">dropped</span></div>'
      : '<div class="ax"><span class="nm">' + nm + '</span>' +
        '<span class="tr" style="width:' + (w / maxW * 100) + '%"><i class="fl" style="width:' + v + '%"></i></span>' +
        '<span class="vl">' + v + '% &times; ' + w.toFixed(2) + '</span></div>').join('') +
    '</div><p class="sub" style="margin-top:12px">An axis the advert says nothing about is dropped and the ' +
    'remaining weights renormalised, never scored zero &mdash; a zero would show a penalty that was never applied.</p>' +
    (m.relations.length ? '<h4 class="mini">How your concepts satisfied theirs</h4><ul class="tight">' +
      m.relations.map(([mine, theirs, rel]) =>
        '<li><b>' + mine + '</b> &rarr; ' + theirs + ' &mdash; ' + rel + ', ' + RELATION_NOTE[rel] + '</li>').join('') +
      '</ul>' : '') +
    '</div>' +
    '<div>' + (m.verdict !== null
      ? '<h4 class="mini">What the model said</h4><p class="quote">' + m.rationale + '</p>' +
        (m.strengths.length ? '<h4 class="mini">Lands well</h4><ul class="tight">' + m.strengths.map((x) => '<li>' + x + '</li>').join('') + '</ul>' : '') +
        (m.gaps.length ? '<h4 class="mini">Worth knowing</h4><ul class="tight">' + m.gaps.map((x) => '<li>' + x + '</li>').join('') + '</ul>' : '')
      : '<h4 class="mini">What the model said</h4><p class="quote">Not judged yet. Each night the budget is split ' +
        'thirty from the top of the ranking and ten drawn evenly across the score bands, so a mid-scoring advert ' +
        'is reached on its own account rather than waiting behind every higher number.</p>') +
    '<div class="row-actions"><button class="action">Write CV and cover letter</button>' +
    '<button class="quiet">Open the advert</button></div></div></div>';
}

/* Dismissal is the write this list cannot work without. 248 roles clear the
   threshold; with no way to say no, yesterday's rejects are back at the top
   tomorrow and the list gets worse every day it is used. */
const dismissed = new Set();
let showDismissed = false;
let lastDismissed = null;

function visibleMatches() {
  return DATA.matches.filter((m) =>
    m.score >= minScore &&
    (!assessedOnly || m.verdict !== null) &&
    (showDismissed ? dismissed.has(m.id) : !dismissed.has(m.id)));
}

function renderShortlist() {
  const rows = visibleMatches();
  $('#shortlistBody').innerHTML = rows.length
    ? rows.map(entryHtml).join('')
    : '<div class="empty">' + (showDismissed
        ? 'Nothing dismissed yet.'
        : 'Nothing above ' + minScore + (assessedOnly ? ' that the model has judged' : '') +
          '. Matches are computed nightly, so a profile saved today is scored tomorrow morning.') + '</div>';

  const n = dismissed.size;
  const toggle = $('#dismissToggle');
  if (toggle) {
    toggle.textContent = showDismissed ? 'Back to the shortlist' : 'Dismissed (' + n + ')';
    toggle.hidden = n === 0 && !showDismissed;
  }
}

function dismiss(id) {
  const m = DATA.matches.find((x) => x.id === id);
  const el = $('.entry[data-match="' + id + '"]');
  dismissed.add(id);
  lastDismissed = id;

  $('#undoText').innerHTML = 'Dismissed <b>' + m.title + '</b> at ' + m.company +
    '. Tonight&rsquo;s sweep will spend its judgement budget elsewhere and this role will not come back tomorrow.';
  $('#undoBar').hidden = false;

  if (REDUCED || !el) { renderShortlist(); return; }
  gsap.set(el, { overflow: 'hidden' });
  gsap.to(el, {
    height: 0, opacity: 0, paddingTop: 0, paddingBottom: 0, borderBottomWidth: 0,
    duration: .3, ease: 'power2.inOut', onComplete: renderShortlist
  });
}

function undoDismiss() {
  if (lastDismissed == null) return;
  dismissed.delete(lastDismissed);
  lastDismissed = null;
  $('#undoBar').hidden = true;
  renderShortlist();
}

  '<section class="card s5"><span class="kicker">Remote preference</span><h2>Three states, not two</h2>',
  '<p class="sub">Remote is left unset by default. Unset means no preference, which is not the same as asking ' +
  'the board for non-remote roles &mdash; and the boards treat those two requests very differently.</p>',
  '<div class="chips"><span class="chip"><b>No preference</b><span class="stamp on">current</span></span>' +
  '<span class="chip">Remote only</span><span class="chip">Exclude remote</span></div></section>',
  '</div>'
].join('') + '</div>';

/* =========================================================================
   Model calls
   ========================================================================= */
const T = DATA.callTotals;
$('#view-calls').innerHTML = [
  '<p class="lede">Forty-one calls today. <span class="fig warn">' + T.discarded + '</span> answers were paid for ',
  'and thrown away.</p>',
  '<p class="lede-note">There is no money on this page. The ledger records tokens, no unit price is stored ',
  'anywhere in the system, and a pound figure would be a number this dashboard invented. Discards are the ',
  'number worth watching instead: a batch can report success and still lose most of its work.</p>',

  '<div class="band">',
  figure('Calls today', fmt(T.calls), T.succeeded + ' clean, ' + T.partial + ' partial, ' + T.failed + ' failed'),
  figure('Answers discarded', String(T.discarded), 'requested, returned, and dropped on the floor'),
  figure('Tokens', '1.24M', fmt(T.reasoning / 1000) + 'k of them reasoning'),
  figure('Median latency', '5.1s', 'extraction batches, ten postings to a call'),
  '</div>',

  '<div class="grid"><section class="card s12"><span class="kicker">Ledger</span><h2>Model calls</h2>',
  '<p class="sub">Last seven days. A partially discarded call succeeded and still lost work, which is exactly the ' +
  'state that used to be invisible &mdash; the affected postings are named so the work can be re-run.</p>',
  '<div class="scroll-x"><table><thead><tr><th scope="col" class="num">Time</th><th scope="col">Purpose</th>',
  '<th scope="col">Model</th><th scope="col" class="num">Items</th><th scope="col" class="num">Tokens</th>',
  '<th scope="col" class="num">Discarded</th><th scope="col" class="num">Latency</th>',
  '<th scope="col">Outcome</th></tr></thead><tbody>' +
  DATA.calls.map((c) =>
    '<tr><td class="num">' + c.t + '</td><td>' + c.purpose + '</td>' +
    '<td><code>' + c.model + '</code></td><td class="num">' + c.items + '</td>' +
    '<td class="num">' + fmt(c.tok) + '</td>' +
    '<td class="num">' + (c.discarded || '—') + '</td>' +
    '<td class="num">' + (c.ms / 1000).toFixed(2) + 's</td>' +
    '<td>' + (c.out === 'Succeeded' ? '<span class="stamp good">Succeeded</span>'
      : c.out === 'Failed' ? '<span class="stamp warn">Failed</span>'
      : '<span class="stamp warn">Partially discarded</span>') +
    (c.reason ? '<div class="sub" style="margin:4px 0 0;font-size:12px">' + c.reason + '</div>' : '') +
    '</td></tr>').join('') +
  '</tbody></table></div></section>',

  card('s6', 'Two models', 'What each one is for',
    'Extraction and match assessment run on the cheaper model, ten postings packed into a call. Application ' +
    'drafting runs on the stronger one, one document at a time, because that output is read by a person.',
    '<div class="chips"><span class="chip"><b>gpt-5.6-luna</b> extraction, matching</span>' +
    '<span class="chip"><b>gpt-5.6-sol</b> CVs and cover letters</span></div>'),
  card('s6', 'Optional', 'What happens with no provider',
    'Enrichment falls back to the deterministic passes, every match stays unjudged, and the ordering falls back ' +
    'to the raw score. Nothing breaks; the shortlist just gets quieter and this page stays empty.',
    '<div class="chips"><span class="chip">Board tagging <b>still runs</b></span>' +
    '<span class="chip">Taxonomy <b>still runs</b></span><span class="chip">Model <b>skipped</b></span></div>'),
  '</div>'
].join('');

/* =========================================================================
   Motion. Budgeted: the nav marker, the drawer, an expanding entry, and chart
   marks on first mount. Figures never count up.
   ========================================================================= */
const mounted = new Set();

function growMarks(scope, key) {
  if (REDUCED || mounted.has(key)) return;
  mounted.add(key);
  gsap.from(scope.querySelectorAll('.measure i, .split i'), { scaleX: 0, duration: .5, stagger: .03, ease: 'power2.out' });
  gsap.from(scope.querySelectorAll('.col'), { scaleY: 0, duration: .5, stagger: .025, ease: 'power2.out' });
}

/* =========================================================================
   Navigation
   ========================================================================= */
const PAGE_LABEL = {};
SECTIONS.forEach((s) => s.pages.forEach(([id, label]) => { PAGE_LABEL[id] = label; }));

let currentSection = 'you';
let currentPage = 'shortlist';
/* Each section remembers the page you left it on. Sending you back to the
   first page of a section throws away where you were. */
const lastPageIn = { you: 'shortlist', market: 'briefing', system: 'searches' };

function renderTabs() {
  const section = SECTIONS.find((s) => s.id === currentSection);
  $('#pages').innerHTML = '<span class="marker" id="marker"></span>' +
    section.pages.map(([id, label]) =>
      '<button data-page="' + id + '" aria-current="' + (id === currentPage ? 'page' : 'false') + '">' + label + '</button>').join('');
}

/* Both indicators are scaled, not width-animated, and are placed instantly on
   first paint: an animated width left the selected label white-on-white for
   the length of the tween. */
function place(el, btn, container, offset, animate) {
  if (!el || !btn) return;
  const r = btn.getBoundingClientRect();
  const base = container.getBoundingClientRect();
  const props = { x: r.left - base.left - (offset || 0), scaleX: r.width };
  if (animate && !REDUCED) gsap.to(el, Object.assign({ duration: .32, ease: 'power3.out' }, props));
  else gsap.set(el, props);
}

const placeMarker = (animate) => place($('#marker'), $('#pages button[aria-current="page"]'), $('#pages'), 0, animate);
const placeThumb = (animate) => place($('#thumb'), $('#sections button[aria-current="true"]'), $('#sections'), 3, animate);

function showPage(page, animate) {
  const section = SECTIONS.find((s) => s.pages.some(([id]) => id === page));
  currentSection = section.id;
  currentPage = page;
  lastPageIn[section.id] = page;

  $$('#sections button').forEach((b) => b.setAttribute('aria-current', b.dataset.section === currentSection ? 'true' : 'false'));
  renderTabs();
  placeThumb(animate);
  placeMarker(animate);
  $('#nowLabel').textContent = PAGE_LABEL[page];
  renderSheet();

  const next = $('#view-' + page);
  const current = $$('.view').find((v) => !v.hidden);
  if (current === next) return false;

  if (current) current.hidden = true;
  next.hidden = false;
  growMarks(next, page);
  return true;
}

/* =========================================================================
   Routing.

   Every navigation goes through the URL rather than around it, so the address
   bar and the view cannot disagree. Hash routing here because the mock is
   opened from a file and from inside an artifact host; the deployed app can
   use real paths unchanged - staticwebapp.config.json already rewrites
   navigation and 404s to /index.html, which is exactly what that needs.

   Page changes and opening a posting PUSH. Filter changes and walking the
   concept graph REPLACE: otherwise Back walks you through every keystroke you
   typed into a search box.
   ========================================================================= */
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  return {
    page: parts[0] || 'shortlist',
    id: parts[1] ? decodeURIComponent(parts[1]) : null,
    params: new URLSearchParams(qs || '')
  };
}

function buildHash(page, id, params) {
  let h = '#/' + page;
  if (id) h += '/' + encodeURIComponent(id);
  const q = params ? params.toString() : '';
  return q ? h + '?' + q : h;
}

/** Push: a new history entry. Used for anything a Back press should undo. */
function go(page, id) {
  const h = buildHash(page, id);
  if (location.hash === h) applyRoute();
  else location.hash = h;
}

/** Replace: same entry, new state. Used for filters and graph walking. */
function replaceRoute(page, id, params) {
  history.replaceState(null, '', buildHash(page, id, params));
}

function postingParams() {
  const q = new URLSearchParams();
  Object.entries(filters).forEach(([k, v]) => { if (v) q.set(k, v); });
  return q;
}

function readPostingParams(params) {
  Object.keys(filters).forEach((k) => {
    filters[k] = params.get(k) || (k === 'sort' ? 'firstSeen' : '');
  });
  const set = (id, val) => { const el = $(id); if (el) el.value = val; };
  set('#f-q', filters.q); set('#f-board', filters.board); set('#f-concept', filters.concept);
  set('#f-level', filters.level); set('#f-work', filters.work); set('#f-interval', filters.interval);
  set('#f-salary', filters.minSalary); set('#f-sort', filters.sort);
}

function shortlistParams() {
  const q = new URLSearchParams();
  if (minScore !== 40) q.set('min', String(minScore));
  if (assessedOnly) q.set('assessed', '1');
  if (showDismissed) q.set('dismissed', '1');
  return q;
}

function readShortlistParams(params) {
  minScore = params.has('min') ? Number(params.get('min')) : 40;
  assessedOnly = params.get('assessed') === '1';
  showDismissed = params.get('dismissed') === '1';
  const slider = $('#minScore'), out = $('#minOut'), sel = $('#assessed');
  if (slider) slider.value = String(minScore);
  if (out) out.textContent = minScore;
  if (sel) sel.selectedIndex = assessedOnly ? 1 : 0;
}

function applyRoute() {
  if (!location.hash) history.replaceState(null, '', '#/shortlist');
  const r = parseHash();
  const page = PAGE_LABEL[r.page] ? r.page : 'shortlist';
  const changed = showPage(page, true);

  if (page === 'postings') { readPostingParams(r.params); renderPostingsTable(); }
  if (page === 'shortlist') { readShortlistParams(r.params); renderShortlist(); }

  if (page === 'postings' && r.id && DATA.postings.some((x) => String(x.id) === r.id)) openPosting(Number(r.id));
  else hideDrawer();

  if (page === 'vocabulary' && r.id && conceptOf(r.id)) selectConcept(r.id);

  applyStoreState();
  if (changed) window.scrollTo({ top: 0 });
}

window.addEventListener('hashchange', applyRoute);

/* =========================================================================
   The waking database.

   sqlSku defaults to free-serverless, which auto-pauses when idle and takes up
   to a minute to come back. The client raises a distinct ApiTimeoutError for
   exactly this, and a promise that never settles is a spinner with nothing to
   click - the worst failure this architecture can produce, because pausing is
   normal here rather than exceptional.

   Metrics and the model-call ledger are Cosmos and stay warm; postings,
   matches, the profile, searches and submissions are SQL. Degrading per region
   rather than per page is the whole point of that split: the reason the
   Briefing reads from Cosmos is so that it still answers when SQL does not.
   ========================================================================= */
let sqlAwake = true;
let sqlWaking = false;

function wakingHtml(label) {
  if (sqlWaking) {
    return '<div class="waking" data-busy="1"><h2><span class="spin"></span>Waking the database</h2>' +
      '<p>' + label + ' will appear as soon as it answers. This usually takes under a minute.</p></div>';
  }
  const cosmos = '<div class="cosmos"><p>Metrics are unaffected: they are served from Cosmos, which does not ' +
    'pause. The corpus was scraped ' + S.scrapedHoursAgo + ' hours ago and ' + fmt(S.newInLastRun) +
    ' postings arrived in that run. The <a href="#/briefing">Briefing</a> and ' +
    '<a href="#/calls">Model calls</a> read from Cosmos and still work.</p></div>';
  return '<div class="waking"><h2>The database did not respond in time</h2>' +
    '<p>' + label + ' is served from SQL, which pauses when idle and can take up to a minute to wake. If this ' +
    'was the first request in a while, retrying usually succeeds.</p>' +
    '<button class="action" data-retry="1">Retry</button>' + cosmos + '</div>';
}

function applyStoreState() {
  $$('[data-sql]').forEach((el) => {
    const prev = el.previousElementSibling;
    const hasNotice = prev && prev.classList.contains('waking');
    if (sqlAwake && !sqlWaking) {
      if (hasNotice) prev.remove();
      el.hidden = false;
    } else {
      if (hasNotice) prev.outerHTML = wakingHtml(el.dataset.sql);
      else el.insertAdjacentHTML('beforebegin', wakingHtml(el.dataset.sql));
      el.hidden = true;
    }
  });
  const t = $('#sleepToggle');
  if (t) t.textContent = sqlAwake ? 'Demo: pause the database' : 'Demo: database paused';
}

function retrySql() {
  sqlWaking = true;
  applyStoreState();
  setTimeout(() => {
    sqlWaking = false;
    sqlAwake = true;
    applyStoreState();
    renderPostingsTable();
    renderShortlist();
  }, 1800);
}

$('#sections').addEventListener('click', (e) => {
  const b = e.target.closest('[data-section]');
  if (b) go(lastPageIn[b.dataset.section]);
});
$('#pages').addEventListener('click', (e) => {
  const b = e.target.closest('[data-page]');
  if (b) go(b.dataset.page);
});

function renderSheet() {
  $('#sheetBody').innerHTML = SECTIONS.map((s) =>
    '<section><h3>' + s.label + '</h3>' + s.pages.map(([id, label]) =>
      '<button class="page" data-page="' + id + '" aria-current="' + (id === currentPage ? 'page' : 'false') + '">' +
      label + (id === currentPage ? '<span>you are here</span>' : '') + '</button>').join('') + '</section>').join('');
}

function openSheet() {
  renderSheet();
  lastFocus = document.activeElement;
  $('#sheet').hidden = false;
  $('#burger').setAttribute('aria-expanded', 'true');
  $('#sheetClose').focus();
  if (!REDUCED) gsap.fromTo('#sheet', { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: .22, ease: 'power3.out' });
}

function closeSheet() {
  if ($('#sheet').hidden) return;
  $('#sheet').hidden = true;
  $('#burger').setAttribute('aria-expanded', 'false');
  $('#burger').focus();
}

$('#burger').onclick = openSheet;
$('#sheetClose').onclick = closeSheet;
$('#sheetBody').addEventListener('click', (e) => {
  const b = e.target.closest('[data-page]');
  if (!b) return;
  closeSheet();
  go(b.dataset.page);
});

/* =========================================================================
   Interaction
   ========================================================================= */
document.addEventListener('click', (e) => {
  const row = e.target.closest('tr[data-posting]');
  if (row) { drawerFromPush = true; go('postings', row.dataset.posting); return; }

  if (e.target.id === 'sleepToggle') {
    sqlAwake = !sqlAwake;
    sqlWaking = false;
    applyStoreState();
    return;
  }
  if (e.target.closest('[data-retry]')) { retrySql(); return; }

  const concept = e.target.closest('[data-concept], [data-goto]');
  if (concept) { selectConcept(concept.dataset.concept || concept.dataset.goto); return; }

  const sw = e.target.closest('[data-switch]');
  if (sw) {
    const on = sw.getAttribute('aria-checked') === 'true';
    sw.setAttribute('aria-checked', String(!on));
    gsap.to(sw.querySelector('i'), { x: on ? 0 : 18, duration: REDUCED ? 0 : .2, ease: 'power2.out' });
    return;
  }

  const drop = e.target.closest('[data-dismiss]');
  if (drop) { dismiss(Number(drop.dataset.dismiss)); return; }

  if (e.target.id === 'undoBtn') { undoDismiss(); return; }

  if (e.target.id === 'dismissToggle') {
    showDismissed = !showDismissed;
    renderShortlist();
    replaceRoute('shortlist', null, shortlistParams());
    return;
  }

  const jump = e.target.closest('[data-go]');
  if (jump) { go(jump.dataset.go); return; }

  const title = e.target.closest('.entry .title');
  if (title) toggleEntry(title.closest('.entry'), title);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeDrawer(); closeSheet(); }
  const row = e.target.closest && e.target.closest('tr[data-posting]');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); drawerFromPush = true; go('postings', row.dataset.posting); }
});

function toggleEntry(art, btn) {
  const box = art.querySelector('.expand');
  const open = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', open ? 'false' : 'true');
  const target = open ? 0 : box.firstElementChild.offsetHeight;
  if (REDUCED) { box.style.height = target + 'px'; return; }
  gsap.to(box, { height: target, duration: .34, ease: 'power2.inOut' });
}

document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'f-q') { filters.q = e.target.value; renderPostingsTable(); replaceRoute('postings', null, postingParams()); }
  if (id === 'f-salary') { filters.minSalary = e.target.value; renderPostingsTable(); replaceRoute('postings', null, postingParams()); }
  if (id === 'conceptFilter') $('#conceptList').innerHTML = conceptList(e.target.value);
  if (id === 'minScore') {
    minScore = Number(e.target.value);
    $('#minOut').textContent = minScore;
    renderShortlist();
    replaceRoute('shortlist', null, shortlistParams());
  }
});

document.addEventListener('change', (e) => {
  const map = { 'f-board': 'board', 'f-concept': 'concept', 'f-level': 'level', 'f-work': 'work',
    'f-interval': 'interval', 'f-sort': 'sort' };
  if (map[e.target.id]) {
    filters[map[e.target.id]] = e.target.value;
    renderPostingsTable();
    replaceRoute('postings', null, postingParams());
  }
  if (e.target.id === 'assessed') {
    assessedOnly = e.target.selectedIndex === 1;
    renderShortlist();
    replaceRoute('shortlist', null, shortlistParams());
  }
  if (e.target.id === 'theme' || e.target.id === 'theme2') {
    const v = e.target.value;
    if (v === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', v);
    const other = $(e.target.id === 'theme' ? '#theme2' : '#theme');
    if (other) other.value = v;
  }
});

$('#scrim').onclick = closeDrawer;

/* =========================================================================
   Load
   ========================================================================= */
renderPostingsTable();
renderShortlist();
$$('[data-switch]').forEach((sw) => {
  gsap.set(sw.querySelector('i'), { x: sw.getAttribute('aria-checked') === 'true' ? 18 : 0 });
});

applyRoute();
placeThumb(false);
placeMarker(false);
growMarks($('#view-' + currentPage), currentPage);

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { placeThumb(false); placeMarker(false); });
}
window.addEventListener('resize', () => { placeThumb(false); placeMarker(false); });
</script>
