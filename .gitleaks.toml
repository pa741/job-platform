# gitleaks configuration for job-platform.
#
# CI runs gitleaks as a backstop behind GitHub push protection, because this repository is
# public. The default rules are kept in full; this file only narrows one false positive.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [rules.allowlist]
  description = """
  Azure built-in role definition ids are public, documented, globally fixed constants - the
  same GUID in every tenant on earth - and the templates reference them by id because that is
  the only stable way to. They are high-entropy strings assigned to variables with names like
  `keyVaultSecretsUser`, which is exactly the shape the generic-api-key rule looks for.

  Allowlisted by explicit value rather than by path or rule suppression, so a genuine secret
  in the same file is still caught, and adding a new role id is a deliberate edit here.

  The last entry is a different false positive with the same character. concepts.json is the
  skill vocabulary, and every one of its 213 entries reads `"key": "qual.prince2"` or
  similar; the rule looks for the word `key` followed by something entropic, which a concept
  key is by coincidence. It is matched by the shape of a concept key rather than by path, so
  the file is still scanned for everything else - a real credential cannot satisfy a pattern
  requiring one of five fixed namespace prefixes followed by lowercase, digits, dots and
  hyphens only.
  """
  regexes = [
    # Storage Blob Data Reader
    '''2a2b9908-6ea1-4ae2-8e65-a410df84e7d1''',
    # Storage Blob Data Owner
    '''b7e6dc6d-f1e8-4753-8033-0f276bb0955b''',
    # Storage Queue Data Contributor
    '''974c5e8b-45b9-4653-ba55-5f855dd0fb88''',
    # Monitoring Metrics Publisher
    '''3913510d-42f4-4e42-8a64-420c390055eb''',
    # Cognitive Services OpenAI User - call model deployments, nothing else
    '''5e0bd9bd-7b93-4f28-af87-19fc36ad61bd''',
    # Key Vault Secrets User - read secret values, nothing else
    '''4633458b-17de-408a-b874-0445c86b69e6''',
    # Key Vault Secrets Officer - set and read secret values, for the human administrator
    '''b86a8fe4-44ce-4948-aee5-eccb2c155cd7''',
    # Storage Blob Data Contributor - scoped to the jobs-curated container only
    '''ba92f5b4-2d11-453d-a403-e96b0029c9fe''',
    # Concept keys in the skill vocabulary, e.g. the value in "key": "qual.prince2".
    # Allowlist regexes are matched against the extracted secret, not the whole line.
    '''(?:skill|domain|type|area|qual)\.[a-z0-9.\-]+''',
  ]
